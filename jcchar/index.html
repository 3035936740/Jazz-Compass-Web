<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色素材预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#212431;font:15px system-ui,sans-serif}main{max-width:1300px;margin:24px auto;padding:0 20px}h1{font-size:24px;margin:0 0 8px}.help{color:#58606e;margin:0 0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button,select,a.link{padding:9px 14px;border:1px solid #c8ced9;border-radius:8px;background:white;color:inherit;font:inherit;cursor:pointer}button.active{background:#2e476c;border-color:#2e476c;color:white}.layout{display:grid;grid-template-columns:minmax(400px,800px) 260px;gap:20px}.stage{position:relative;aspect-ratio:1;width:100%;background-color:white;overflow:hidden;border:1px solid #d3d8e0;border-radius:12px}.stage.checker{background-image:linear-gradient(45deg,#e0e3e7 25%,transparent 25%),linear-gradient(-45deg,#e0e3e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e0e3e7 75%),linear-gradient(-45deg,transparent 75%,#e0e3e7 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage.dark{background:#20242c}.sprite{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.baseline{opacity:.25;display:none}.stage.overlay .baseline{display:block}.stage.grid:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:linear-gradient(#458bdb33 1px,transparent 1px),linear-gradient(90deg,#458bdb33 1px,transparent 1px);background-size:10% 10%}.cross{position:absolute;left:50%;top:95%;width:22px;height:22px;transform:translate(-50%,-50%);display:none}.cross:before,.cross:after{content:"";position:absolute;background:#ff3d68}.cross:before{left:10px;width:2px;height:22px}.cross:after{top:10px;width:22px;height:2px}.stage.grid .cross{display:block}.states{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.states button{font-size:14px;padding:7px 10px}h2{font-size:15px;margin:16px 0 8px}.path{font:12px monospace;overflow-wrap:anywhere;padding:10px;background:#e6ebf1;border-radius:8px}.error{color:#ae2540;min-height:20px}.settings{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}.settings label{display:flex;align-items:center;gap:6px}.link{display:inline-block;text-decoration:none;margin-top:12px}small{color:#58606e;line-height:1.6}@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{max-width:800px}.panel{order:-1}.states{margin:6px 0}}
.sprite{transform-origin:50% 50%;backface-visibility:visible}
#sprite{will-change:transform}
.motion-hit,.idle-motion,.click-motion{position:absolute;inset:0;width:100%;height:100%}
.motion-hit{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cross{pointer-events:none}
.motion-hit:focus-visible{outline:3px solid #458bdb;outline-offset:-4px;border-radius:12px}
.idle-motion,.click-motion{transform-origin:50% 95%;will-change:transform}
.idle-motion{animation:idle-jelly 2.4s cubic-bezier(.37,0,.63,1) infinite}
@keyframes idle-jelly{
  0%,100%{transform:translateY(.5%) scale(1.01,.965)}
  50%{transform:translateY(-.75%) scale(.993,1.002)}
}
</style>
<main><h1>游戏角色素材预览</h1><p class="help">固定 800 × 800 画布。默认轻微果冻弹动，点击角色触发大弹跳；切换状态时纸片翻转。</p><nav id="characters"></nav><div class="layout"><section><div id="stage" class="stage checker"><img id="baseline" class="sprite baseline" alt=""><div id="motion-hit" class="motion-hit" role="button" tabindex="0" aria-label="点击角色，果冻弹跳"><div id="idle-motion" class="idle-motion"><div id="click-motion" class="click-motion"><img id="sprite" class="sprite" alt=""></div></div></div><span class="cross"></span></div><div class="settings"><select id="background"><option value="checker">透明棋盘格</option><option value="white">白色背景</option><option value="dark">深色背景</option></select><label><input type="checkbox" id="overlay">叠加默认状态</label><label><input type="checkbox" id="grid">网格与固定锚点</label></div></section><aside class="panel"><div id="states"></div><p id="error" class="error"></p><div id="path" class="path"></div><a id="download" class="link" download>下载当前 PNG</a><p><small>每个文件完整保留画布，无自动裁切。导入游戏时统一使用同一纹理矩形、显示尺寸和锚点。</small></p></aside></div></main>

g"},{"category":"expressions","state":"proud","label":"得意","file":"04_jaz/expressions/proud.png"},{"category":"expressions","state":"mocking","label":"嘲讽","file":"04_jaz/expressions/mocking.png"},{"category":"expressions","state":"confused","label":"疑惑","file":"04_jaz/expressions/confused.png"},{"category":"expressions","state":"shocked","label":"震惊","file":"04_jaz/expressions/shocked.png"},{"category":"expressions","state":"angry","label":"生气","file":"04_jaz/expressions/angry.png"},{"category":"expressions","state":"serious","label":"认真","file":"04_jaz/expressions/serious.png"},{"category":"expressions","state":"hurt","label":"受击","file":"04_jaz/expressions/hurt.png"},{"category":"expressions","state":"defiant","label":"嘴硬","file":"04_jaz/expressions/defiant.png"},{"category":"expressions","state":"concede","label":"认输","file":"04_jaz/expressions/concede.png"},{"category":"poses","state":"idle","label":"待机","file":"04_jaz/poses/idle.png"},{"category":"poses","state":"speaking","label":"讲话","file":"04_jaz/poses/speaking.png"},{"category":"poses","state":"correct","label":"答对反应","file":"04_jaz/poses/correct.png"},{"category":"poses","state":"incorrect","label":"答错反应","file":"04_jaz/poses/incorrect.png"},{"category":"poses","state":"streak","label":"连续答对反应","file":"04_jaz/poses/streak.png"},{"category":"endings","state":"one_star","label":"1星结局","file":"04_jaz/endings/one_star.png"},{"category":"endings","state":"two_star","label":"2星结局","file":"04_jaz/endings/two_star.png"},{"category":"endings","state":"three_star","label":"3星投降","file":"04_jaz/endings/three_star.png"},{"category":"boss","state":"phase2","label":"第二阶段","file":"04_jaz/boss/phase2.png"},{"category":"boss","state":"first_meeting","label":"初次见面","file":"04_jaz/boss/first_meeting.png"},{"category":"boss","state":"return_meeting","label":"再次见面","file":"04_jaz/boss/return_meeting.png"}]},{"id":"05_araya","name":"阿拉娅","assets":[{"category":"expressions","state":"default","label":"默认","file":"05_araya/expres const $=id=>document.getElementById(id);
let character=DATA.characters[0],current=null,pending=null,busy=false;
const cats={expressions:'标准表情',poses:'标准姿态',endings:'星级结局',boss:'Boss 状态'};
const decoded=new Map();
let jellyAnimation=null;
function bounce(){
  const layer=$('click-motion');
  // Restart from the visible deformation so repeated clicks stay continuous.
  const start=getComputedStyle(layer).transform;
  if(jellyAnimation)jellyAnimation.cancel();
  const animation=layer.animate([
    {offset:0,transform:start==='none'?'translateY(0) scale(1,1)':start},
    {offset:.16,transform:'translateY(.75%) scale(1.035,.88)'},
    {offset:.40,transform:'translateY(-1%) scale(.982,1.026)'},
    {offset:.62,transform:'translateY(.25%) scale(1.018,.957)'},
    {offset:.80,transform:'translateY(-.375%) scale(.992,1.012)'},
    {offset:1,transform:'translateY(0) scale(1,1)'}
  ].map(frame=>({...frame,easing:'cubic-bezier(.22,.7,.3,1)'})),{duration:820,easing:'linear'});
  jellyAnimation=animation;layer.dataset.bouncing='true';
  animation.onfinish=()=>{
    if(jellyAnimation!==animation)return;
    jellyAnimation=null;layer.dataset.bouncing='false';
  };
}
$('motion-hit').onclick=bounce;
$('motion-hit').onkeydown=event=>{
  if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!event.repeat)bounce()}
};
function preload(file){
  if(!decoded.has(file)){
    const image=new Image();image.src=file;
    decoded.set(file,image.decode().catch(error=>{decoded.delete(file);throw error}));
  }
  return decoded.get(file);
}
function commit({asset,owner}){
  current=asset;$('sprite').src=asset.file;$('sprite').alt=owner.name+' · '+asset.label;
  $('baseline').src=owner.assets.find(x=>x.category==='expressions'&&x.state==='default').file;
  $('path').textContent=asset.file;$('download').href=asset.file;
}
async function rotate(from,to,duration,easing){
  const sprite=$('sprite');
  const animation=sprite.animate([{transform:'rotateY('+from+'deg)'},{transform:'rotateY('+to+'deg)'}],{duration,easing,fill:'forwards'});
  await animation.finished;
  sprite.style.transform='rotateY('+to+'deg)';
  animation.cancel();
}
async function drain(){
  if(busy)return;
  busy=true;$('sprite').dataset.busy='true';
  try{
    while(pending){
      const request=pending;pending=null;
      try{await preload(request.asset.file)}
      catch(error){if(!pending)$('error').textContent='此素材无法加载：'+request.asset.file;continue}
      if(pending)continue;
      if(!current||current.file===request.asset.file){commit(request);continue}
      // A complete 0 → 360° turn; replace the decoded texture exactly edge-on.
      $('sprite').dataset.flipping='true';
      await rotate(0,90,180,'ease-in');
      commit(request);
      await new Promise(resolve=>requestAnimationFrame(resolve));
      await rotate(90,360,540,'ease-out');
      $('sprite').style.transform='';
      $('sprite').dataset.flipping='false';
    }
  }finally{
    busy=false;$('sprite').dataset.busy='false';
    $('sprite').dataset.flipping='false';$('sprite').style.transform='';
    if(pending)drain();
  }
}
function show(asset){
  pending={asset,owner:character};$('error').textContent='';
  document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===asset.file));
  drain();
}
function choose(c){character=c;document.querySelectorAll('[data-character]').forEach(b=>b.classList.toggle('active',b.dataset.character===c.id));$('states').replaceChildren();Object.keys(cats).forEach(category=>{const heading=document.createElement('h2');heading.textContent=cats[category];$('states').append(heading);const group=document.createElement('div');group.className='states';c.assets.filter(x=>x.category===category).forEach(asset=>{const button=document.createElement('button');button.dataset.state=asset.file;button.textContent=asset.label;button.onclick=()=>show(asset);group.append(button)});$('states').append(group)});show(c.assets[0]);}
DATA.characters.forEach(c=>{const b=document.createElement('button');b.dataset.character=c.id;b.textContent=c.name;b.onclick=()=>choose(c);$('characters').append(b)});$('sprite').onerror=()=>{$('error').textContent='此素材暂未导出：'+current.file};$('background').onchange=()=>{$('stage').classList.remove('checker','dark');if($('background').value!=='white')$('stage').classList.add($('background').value)};$('overlay').onchange=()=>{$('stage').classList.toggle('overlay',$('overlay').checked)};$('grid').onchange=()=>{$('stage').classList.toggle('grid',$('grid').checked)};choose(character);
</script></html>
